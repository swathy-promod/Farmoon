{% extends 'Farmer/Head.html' %}
{% block content %}

<style>
    /* ── Page background ── */
    .page-wrapper {
        padding: 110px 0 60px;
        min-height: 100vh;
        background: #f8faf6;
    }

    /* ── Section heading ── */
    .section-title {
        font-family: 'Lora', serif;
        font-size: 1.7rem;
        font-weight: 700;
        color: #333;
        position: relative;
        padding-bottom: 10px;
        margin-bottom: 28px;
    }

    .section-title::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 48px;
        height: 3px;
        background: var(--bs-primary, #5cb85c);
        border-radius: 2px;
    }

    /* ── Form Card ── */
    .form-card {
        background: #fff;
        border-top: 4px solid var(--bs-primary, #5cb85c);
        box-shadow: 0 6px 32px rgba(0,0,0,0.09);
        border-radius: 0;
        padding: 38px 40px;
    }

    /* ── Intro badge ── */
    .intro-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #eaf5ea;
        color: var(--bs-primary, #5cb85c);
        font-family: 'Open Sans', sans-serif;
        font-size: 0.78rem;
        font-weight: 600;
        padding: 4px 14px;
        border-radius: 50px;
        margin-bottom: 20px;
    }

    /* ── Form elements ── */
    .form-label {
        font-family: 'Open Sans', sans-serif;
        font-weight: 600;
        color: #555;
        font-size: 0.88rem;
        margin-bottom: 5px;
    }

    .form-control,
    .form-select {
        border-radius: 0;
        border: 1px solid #ddd;
        padding: 11px 15px;
        font-family: 'Open Sans', sans-serif;
        font-size: 0.88rem;
        transition: border-color 0.3s;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: var(--bs-primary, #5cb85c);
        box-shadow: 0 0 0 0.2rem rgba(92,184,92,0.15);
    }

    .input-group-text {
        border-radius: 0;
        background: #f8f9fa;
        border: 1px solid #ddd;
        color: var(--bs-primary, #5cb85c);
        min-width: 42px;
        justify-content: center;
    }

    .btn-predict {
        border-radius: 50px;
        padding: 11px 40px;
        font-family: 'Open Sans', sans-serif;
        font-weight: 500;
        font-size: 0.92rem;
        letter-spacing: 0.4px;
    }

    /* ── Result box ── */
    .result-box {
        margin-top: 28px;
        border: 2px solid var(--bs-primary, #5cb85c);
        background: #eaf5ea;
        padding: 22px 28px;
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .result-icon {
        width: 52px;
        height: 52px;
        background: var(--bs-primary, #5cb85c);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 1.3rem;
        flex-shrink: 0;
    }

    .result-label {
        font-family: 'Open Sans', sans-serif;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #888;
        margin-bottom: 3px;
    }

    .result-crop {
        font-family: 'Lora', serif;
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--bs-primary, #5cb85c);
    }

    /* ── Field group divider label ── */
    .field-group-label {
        font-family: 'Lora', serif;
        font-size: 0.82rem;
        font-weight: 700;
        color: #bbb;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin: 8px 0 14px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .field-group-label::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #f0f0f0;
    }
</style>

<div class="page-wrapper">
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-lg-7 col-md-9">

                <!-- Page Title -->
                <h2 class="section-title text-center wow fadeInUp" data-wow-delay="0.1s">
                    Crop Recommendation
                </h2>

                <!-- Form Card -->
                <div class="form-card wow fadeInUp" data-wow-delay="0.15s">

                    <div class="intro-badge">
                        <i class="fa fa-lightbulb"></i>
                        Enter your soil and climate data to get a recommendation
                    </div>

                    <form action="{% url 'Farmer:CropRecommend' %}" method="post">
                        {% csrf_token %}

                        <div class="row g-3">

                            <!-- Climate group -->
                            <div class="col-12">
                                <div class="field-group-label">Climate</div>
                            </div>

                            <!-- Temperature -->
                            <div class="col-md-6">
                                <label class="form-label">Temperature</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa fa-thermometer-half"></i></span>
                                    <input type="number" step="0.01" name="temperature"
                                           class="form-control" placeholder="°C" required>
                                </div>
                            </div>

                            <!-- Humidity -->
                            <div class="col-md-6">
                                <label class="form-label">Humidity</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa fa-tint"></i></span>
                                    <input type="number" step="0.01" name="humidity"
                                           class="form-control" placeholder="%" required>
                                </div>
                            </div>

                            <!-- Rainfall -->
                            <div class="col-md-6">
                                <label class="form-label">Rainfall</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa fa-cloud-rain"></i></span>
                                    <input type="number" step="0.01" name="rainfall"
                                           class="form-control" placeholder="mm" required>
                                </div>
                            </div>

                            <!-- Soil group -->
                            <div class="col-12 mt-2">
                                <div class="field-group-label">Soil</div>
                            </div>

                            <!-- Nitrogen -->
                            <div class="col-md-6">
                                <label class="form-label">Nitrogen</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa fa-flask"></i></span>
                                    <input type="number" name="nitrogen"
                                           class="form-control" placeholder="N level" required>
                                </div>
                            </div>

                            <!-- Potassium -->
                            <div class="col-md-6">
                                <label class="form-label">Potassium</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa fa-flask"></i></span>
                                    <input type="number" name="potassium"
                                           class="form-control" placeholder="K level" required>
                                </div>
                            </div>

                            <!-- Soil Type -->
                            <div class="col-md-6">
                                <label class="form-label">Soil Type</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa fa-layer-group"></i></span>
                                    <select name="soiltype" class="form-select" required>
                                        <option value="">— Select —</option>
                                        <option value="2">Clayey</option>
                                        <option value="4">Sandy</option>
                                        <option value="3">Loamy</option>
                                        <option value="0">Alluvial</option>
                                        <option value="1">Black</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Soil Depth -->
                            <div class="col-md-6">
                                <label class="form-label">Soil Depth (cm)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa fa-ruler-vertical"></i></span>
                                    <input type="number" step="0.01" name="soil_depth" max="250"
                                           class="form-control" placeholder="Max 250 cm" required>
                                </div>
                            </div>

                            <!-- Submit -->
                            <div class="col-12 mt-2">
                                <button type="submit" class="btn btn-primary btn-predict w-100">
                                    <i class="fa fa-seedling me-2"></i>Predict Crop
                                </button>
                            </div>

                        </div>
                    </form>

                    <!-- ── Result ── -->
                    {% if res %}
                    <div class="result-box wow fadeInUp" data-wow-delay="0.1s">
                        <div class="result-icon">
                            <i class="fa fa-leaf"></i>
                        </div>
                        <div>
                            <div class="result-label">Recommended Crop</div>
                            <div class="result-crop">{{ res }}</div>
                        </div>
                    </div>
                    {% endif %}

                </div>

            </div>
        </div>

    </div>
</div>

{% endblock content %}
