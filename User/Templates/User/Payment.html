{% extends 'User/Head.html' %}
{% block content %}

<style>
    /* ── Page ── */
    .page-wrapper {
        padding: 110px 0 60px;
        min-height: 100vh;
        background: #f8faf6;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* ── Section heading ── */
    .section-title {
        font-family: 'Lora', serif;
        font-size: 1.7rem;
        font-weight: 700;
        color: #333;
        position: relative;
        padding-bottom: 10px;
        margin-bottom: 36px;
        text-align: center;
    }

    .section-title::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 48px;
        height: 3px;
        background: var(--bs-primary, #5cb85c);
        border-radius: 2px;
    }

    /* ── Payment Card ── */
    .payment-card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.07);
        border-bottom: 3px solid transparent;
        transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
        overflow: hidden;
        width: 100%;
        max-width: 480px;
        padding: 40px 36px;
    }

    .payment-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 14px 40px rgba(0,0,0,0.13);
        border-bottom-color: var(--bs-primary, #5cb85c);
    }

    /* ── Card icon strip ── */
    .card-icons {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 28px;
    }

    .card-icons span {
        background: #f5fbf3;
        border: 1px solid #c8ecd0;
        border-radius: 8px;
        padding: 5px 12px;
        font-size: 0.72rem;
        font-family: 'Open Sans', sans-serif;
        font-weight: 700;
        color: var(--bs-primary, #5cb85c);
        letter-spacing: 0.4px;
    }

    /* ── Form fields ── */
    .field-group {
        margin-bottom: 18px;
    }

    .field-label {
        font-family: 'Open Sans', sans-serif;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #aaa;
        margin-bottom: 6px;
        display: block;
    }

    .field-input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #c8ecd0;
        border-radius: 50px;
        font-family: 'Open Sans', sans-serif;
        font-size: 0.88rem;
        color: #333;
        background: #fff;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
        box-sizing: border-box;
    }

    .field-input:focus {
        border-color: var(--bs-primary, #5cb85c);
        box-shadow: 0 0 0 3px rgba(92,184,92,0.12);
    }

    /* month input fix */
    input[type="month"].field-input {
        padding: 10px 16px;
    }

    /* ── Amount box ── */
    .amount-box {
        background: #f5fbf3;
        border: 1px solid #c8ecd0;
        border-radius: 14px;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
    }

    .amount-label {
        font-family: 'Open Sans', sans-serif;
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #aaa;
    }

    .amount-value {
        font-family: 'Lora', serif;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--bs-primary, #5cb85c);
    }

    /* ── Row for expiry + cvv ── */
    .field-row {
        display: flex;
        gap: 14px;
    }

    .field-row .field-group {
        flex: 1;
    }

    /* ── Pay button ── */
    .btn-pay {
        width: 100%;
        border-radius: 50px;
        font-family: 'Open Sans', sans-serif;
        font-size: 0.92rem;
        font-weight: 700;
        padding: 14px;
        background: var(--bs-primary, #5cb85c);
        border: none;
        color: #fff;
        cursor: pointer;
        transition: background 0.25s, transform 0.2s, box-shadow 0.2s;
        letter-spacing: 0.3px;
    }

    .btn-pay:hover {
        background: #4aa84a;
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(92,184,92,0.25);
    }

    /* ── Secure note ── */
    .secure-note {
        text-align: center;
        font-family: 'Open Sans', sans-serif;
        font-size: 0.72rem;
        color: #bbb;
        margin-top: 14px;
    }

    .secure-note i {
        color: var(--bs-primary, #5cb85c);
        margin-right: 4px;
    }
</style>

<div class="page-wrapper">
    <div class="wow fadeInUp" data-wow-delay="0.1s" style="width:100%; display:flex; justify-content:center; padding: 0 16px;">

        <div class="payment-card">

            <!-- Title -->
            <h2 class="section-title">Payment Gateway</h2>

            <!-- Card type badges -->
            <div class="card-icons">
                <span><i class="fa fa-credit-card me-1"></i>VISA</span>
                <span><i class="fa fa-credit-card me-1"></i>MASTER</span>
                <span><i class="fa fa-credit-card me-1"></i>RUPAY</span>
            </div>

            <form action="" method="post">
                {% csrf_token %}

                <!-- Cardholder Name -->
                <div class="field-group">
                    <label class="field-label">
                        <i class="fa fa-user me-1"></i>Card Holder Name
                    </label>
                    <input type="text"
                           name="txt_cardholder"
                           class="field-input"
                           required
                           placeholder="Enter cardholder name"
                           pattern="[A-Za-z ]{3,30}"
                           title="Only alphabets allowed (3–30 characters)">
                </div>

                <!-- Card Number -->
                <div class="field-group">
                    <label class="field-label">
                        <i class="fa fa-credit-card me-1"></i>Card Number
                    </label>
                    <input type="text"
                           name="txt_cardnumber"
                           class="field-input"
                           required
                           placeholder="1234 5678 9012 3456"
                           pattern="[0-9]{16}"
                           maxlength="16"
                           title="Card number must be 16 digits">
                </div>

                <!-- Expiry + CVV side by side -->
                <div class="field-row">
                    <div class="field-group">
                        <label class="field-label">
                            <i class="fa fa-calendar me-1"></i>Expiry Date
                        </label>
                        <input type="month"
                               name="txt_expirydate"
                               class="field-input"
                               required>
                    </div>
                    <div class="field-group">
                        <label class="field-label">
                            <i class="fa fa-lock me-1"></i>CVV
                        </label>
                        <input type="password"
                               name="txt_cvv"
                               class="field-input"
                               required
                               pattern="[0-9]{3}"
                               maxlength="3"
                               placeholder="•••"
                               title="CVV must be 3 digits">
                    </div>
                </div>

                <!-- Amount -->
                <div class="amount-box">
                    <span class="amount-label">
                        <i class="fa fa-receipt me-1"></i>Total Amount
                    </span>
                    <span class="amount-value">₹{{ bookingdata.booking_amount }}</span>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-pay">
                    <i class="fa fa-lock me-2"></i>Pay Now
                </button>

                <div class="secure-note">
                    <i class="fa fa-shield-alt"></i>
                    Your payment is secured with 256-bit SSL encryption
                </div>

            </form>

        </div>
    </div>
</div>

{% endblock content %}
