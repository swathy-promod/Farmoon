<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="post">
        {% csrf_token %}
        <table align="center" border="2">
             <tr>
                <td>Number 1</td>
                <td><input required type="text" name="txt_num1"></td>
            </tr>
            <tr>
                <td>Number 2</td>
                <td><input required type="text" name="txt_num2"></td>
            </tr>
            <tr align="center">
			    <td colspan="2">
			    <input type="submit" name="btn_submit" value="+"/>
			    <input type="submit" name="btn_submit" value="-"/>			   
                <input type="submit" name="btn_submit" value="*"/>
			    <input type="submit" name="btn_submit" value="/"/>
                </td>
			</tr>
            <tr>
                <td>
                    Result
                </td>
                <td>
                  {{result}}  
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
